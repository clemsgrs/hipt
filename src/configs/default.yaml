data:
  train_csv:
  tune_csv:
  test_csv:

output_dir: "output" # output directory

task: "classification" # task type: classification, regression, survival

survival:
  loss: "nll" # survival loss: "nll" (discrete-time) or "coxph" (continuous-time)
  cox:
    n: 48 # prediction-accumulation window size = Cox risk-set size
    ties: "breslow" # tie handling passed to torchsurv: "breslow" or "efron"
    event_balanced: true # guarantee at least min_events events per window
    min_events: 1 # minimum number of events per accumulation window

num_classes: 6 # number of classes for classification task
label_name: "label"
label_mapping:

metrics: # list of metrics to compute
 - "quadratic_kappa"

features_dir: "/path/to/precomputed/tile/features"
features_dim: 1024

model:
  level: "local" # model level ("global" or "local")
  batch_size: 1
  dropout: 0.0
  region_size: 4096
  patch_size: 256
  embed_dim_patch: ${features_dim}
  embed_dim_region: 192
  embed_dim_slide: 192
  pretrained_weights:
  img_size_pretrained:
  mask_attn: False
  num_register_tokens: 0

training:
  nepochs: 100
  batch_size: 1
  gradient_accumulation: 32

tuning:
  batch_size: 1
  tune_every: 1

testing:
  retrieve_checkpoint: "best"

optim:
  name: "adam"
  lr: 0.0002
  wd: 1e-5
  lr_scheduler:
    name: "step"
    step_size: 20
    gamma: 0.5

early_stopping:
  enable: false
  tracking: "loss"
  min_max: "min"
  patience: 10
  min_epoch: 30
  save_all: false

speed:
  num_workers: 8

wandb:
  enable: false
  project: "" # wandb project name
  username: "" # wandb username
  exp_name: "" # wandb experiment name
  tags: [] # wandb tags
  dir: "/home/user/"
  group: